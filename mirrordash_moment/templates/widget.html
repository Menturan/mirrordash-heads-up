<!-- A moment: large light text in the middle, fading in, holding and fading out over the whole duration, so
     the card is already invisible when the module takes it away. Only opacity and a small rise move. -->
<style>
    .moment {
        --slow: 1;  /* reduced motion: twice as slow, no rise */
        --rise: 8px;
        text-align: center;
        text-wrap: balance;
        overflow-wrap: anywhere;  /* a long word wraps inside the centre instead of reaching the edges */
        opacity: 0;
        animation:
            moment-in calc(var(--fade) * var(--slow) * 1s) ease-out both,
            moment-out calc(var(--fade) * var(--slow) * 1s) ease-in calc((var(--seconds) - var(--margin) - var(--fade) * var(--slow)) * 1s) forwards;
    }
    .moment-long { font-size: 44px; line-height: 1.2; }  /* a long text, a step below display-lg */
    @media (prefers-reduced-motion: reduce) { .moment { --slow: 2; --rise: 0px; } }
    @keyframes moment-in  { from { opacity: 0; transform: translateY(var(--rise)); } to { opacity: 1; transform: none; } }
    @keyframes moment-out { from { opacity: 1; } to { opacity: 0; } }
</style>
{% if text %}
<div class="moment {{ size }}" data-moment="{{ count }}" style="--seconds: {{ seconds }}; --fade: {{ fade }}; --margin: {{ margin }}">{{ text }}</div>
{% endif %}
